name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so VitePress can read each page's last commit date
          # for lastUpdated and the sitemap's <lastmod>.
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build website
        working-directory: website
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # Tells IndexNow (Bing and the other search engines that share it) which
  # pages the push changed, once they are live. A page is a Markdown file in
  # website/docs/ (outside .vitepress/), so a change to the theme or the
  # config, which is not a change of content, sends nothing. Deleted pages
  # are sent too, so the search engines see they are gone. The key is public:
  # docs.unlibra.com/<key>.txt (the unlibra.github.io repository).
  indexnow:
    name: Notify IndexNow
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    # A new branch or a rewritten history has no commit to compare with.
    if: github.event.before != '0000000000000000000000000000000000000000' && !github.event.forced
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Send the changed pages
        env:
          BEFORE: ${{ github.event.before }}
          SITE: https://docs.unlibra.com/tkinter-unblur/
          KEY: 67426e8c4c044cef96ebc2f901da0154
        run: |
          # The URLs cleanUrls serves: "foo/index.md" -> "foo/", "foo.md" -> "foo".
          urls=$(git diff --name-only --no-renames "$BEFORE" "$GITHUB_SHA" -- website/docs \
            | grep -E '\.md$' | grep -v '^website/docs/\.vitepress/' \
            | sed -e 's|^website/docs/||' -e 's|^index\.md$||' -e 's|/index\.md$|/|' -e 's|\.md$||' -e "s|^|$SITE|" || true)
          if [ -z "$urls" ]; then
            echo "No page changed."
            exit 0
          fi
          echo "$urls"
          body=$(jq -n --arg key "$KEY" --arg urls "$urls" \
            '{host: "docs.unlibra.com", key: $key, keyLocation: ("https://docs.unlibra.com/" + $key + ".txt"), urlList: ($urls | split("\n"))}')
          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -H 'content-type: application/json; charset=utf-8' --data "$body" https://api.indexnow.org/indexnow)
          echo "IndexNow: $status $(cat response.txt)"
          [ "$status" = 200 ] || [ "$status" = 202 ]
